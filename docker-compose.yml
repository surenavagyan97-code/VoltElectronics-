services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build: ./backend
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=mssql,1433;Database=VoltElectronics;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: ${JWT_KEY}
      Payments__Provider: ${PAYMENTS_PROVIDER:-Fake}
      Payments__CallbackBaseUrl: ${PAYMENTS_CALLBACK_BASE_URL:-http://localhost:8080}
      Payments__FrontendBaseUrl: ${PAYMENTS_FRONTEND_BASE_URL:-http://localhost}
      Payments__Ameria__BaseUrl: ${AMERIA_BASE_URL:-https://servicestest.ameriabank.am/VPOS}
      Payments__Ameria__ClientId: ${AMERIA_CLIENT_ID:-}
      Payments__Ameria__Username: ${AMERIA_USERNAME:-}
      Payments__Ameria__Password: ${AMERIA_PASSWORD:-}
      Payments__Ameria__Currency: ${AMERIA_CURRENCY:-USD}
      Payments__Ameria__OrderIdOffset: ${AMERIA_ORDER_ID_OFFSET:-0}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/wwwroot/uploads

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  mssql-data:
  uploads:
